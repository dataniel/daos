url: https://dataniel.github.io/daos

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/dataniel/daos

home:
  strip_header: true

reference:
  - title: General utilities
    contents:
      - f
      - nowf
      - shh
      - is_blank
      - "%??%"
      - "%like%"

  - title: Workspace
    contents:
      - summon

  - title: Data wrangling
