url: https://dataniel.github.io/daos

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/dataniel/daos

home:
  strip_header: true

reference:
  - title: General utilities
    contents:
      - f
      - nowf
      - shh
      - is_blank
      - "%??%"
      - "%like%"

  - title: File workflow
    contents:
      - read_files
      - read_access
      - summon
      - write_excel

  - title: Data wrangling
    contents:
      - view_types
      - flag_duplicates
      - diagnose_timeseries
      - drop_empty_rows
      - drop_empty_cols
      - split_by
      - spells_to_panel
      - add_spell_status

  - title: Validation checkpoints
    desc: >
      State a rule as "the set of violations must be empty". The
      `expect_*()` functions judge a rule and warn or abort;
      `tally_violations()` only counts violations for many rules, so you
      decide on severity afterwards. See `vignette("validation")`.
    contents:
      - expect_empty
      - expect_none
      - expect_unique
      - expect_balanced
      - expect_no_overlap
      - last_violations
      - tally_violations

  - title: Interactive
    contents:
      - screen_timeseries

  - title: Danish and Greenlandic data
    contents:
      - clean_cpr
      - add_cpr_info
      - age
      - clean_cvr
      - format_db07
      - convert_db07_to_db25
      - convert_db25_to_db07
      - db_label
      - inspect_db
      - read_ta
      - write_ta
      - read_ta2
      - write_ta2

articles:
  - title: Get started
    navbar: ~
    contents:
      - daos

  - title: Guides
    navbar: Guides
    contents:
      - read-files
      - validation
