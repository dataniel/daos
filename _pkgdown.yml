      The checkpoints have moved to the expectr package.
      daos forwards them for existing scripts.
    contents:
      - moved-to-expectr

  - title: Interactive
    contents:
      - screen_timeseries

  - title: Danish and Greenlandic data
    contents:
      - clean_cpr
      - add_cpr_info
      - age
      - clean_cvr
      - format_db07
      - convert_db07_to_db25
      - convert_db25_to_db07
